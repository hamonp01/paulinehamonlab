# site properties and page defaults
title: Hamon Lab
subtitle: Macrophages & Cancer
description: The Hamon Lab investigates how macrophage diversity shapes cancer progression, immune responses, and treatment outcomes. By combining human samples, spatial technologies, and experimental models, we aim to uncover new strategies to harness macrophage biology for cancer therapy.
header: images/Research/baniere-ihc.png
footer: images/cordeliers/cordeliers-1.jpeg
proofer: false

# site social media and other links
links:
  email: pauline.hamon@inserm.fr
  orcid: 0000-0002-6776-1635
  google-scholar: https://scholar.google.com/citations?user=-97Fo6wAAAAJ&hl=en
  github: hamonp01
  linkedin: pauline-hamon-389746a9

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
